<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVTEAM NP - Presentasi Motivasi</title>
    <style>
        /* Gaya Dasar dan Reset */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #E0E0E0;
            overflow: hidden;
        }

        /* Container Slide */
        .slide-container {
            width: 200%;
            height: 100vh;
            display: flex;
            transition: transform 0.8s ease-in-out;
        }

        /* Gaya Slide Umum */
        .slide {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            padding: 40px;
            position: relative; /* Penting untuk positioning konten internal */
        }

        /* Slide 1: Logo dan Motivasi */
        #slide1 {
            background-color: #121212;
        }

        #slide1 .logo {
            max-width: 300px;
            margin-bottom: 30px;
            width: 80%;
            height: auto;
        }

        #slide1 h1 {
            font-size: 2.5em;
            color: #FFD700;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        #slide1 p {
            font-size: 1.2em;
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .button {
            background-color: #FFD700;
            color: #121212;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.1s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button:hover {
            background-color: #FFA500;
            transform: translateY(-2px);
        }

        /* Slide 2: Background Obor dan Audio Player */
        #slide2 {
            /* Pastikan nama file sesuai: background_obor.jpg */
            background-image: url('background_obor.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Overlay gelap untuk meningkatkan keterbacaan */
        #slide2::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        /* Kontainer khusus untuk memposisikan audio player di bawah tengah */
        .slide-content-bottom-center {
            position: absolute;
            bottom: 10%; /* Jarak 10% dari bawah slide */
            left: 50%;
            transform: translateX(-50%); /* Geser ke kiri 50% dari lebar sendiri */
            width: 90%;
            max-width: 400px; /* Batasi lebar maksimum */
            z-index: 2; /* Di atas overlay */
        }

        .audio-player-container {
            background: rgba(18, 18, 18, 0.9);
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
            text-align: center;
        }

        .audio-player-container h2 {
            color: #FFD700;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        audio {
            width: 100%;
            /* Filter ini mungkin tidak sepenuhnya didukung di semua browser/OS, 
               tetapi membantu membuat kontrol default lebih kontras di background gelap. */
            filter: invert(1) hue-rotate(180deg);
        }

        /* Kontrol untuk perpindahan slide */
        .show-slide-2 {
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <div class="slide-container" id="slideContainer">
        
        <div class="slide" id="slide1">
            <img src="logo.png" alt="DVTEAM NP Logo" class="logo">
            
            <h1>✨ **VISI, TEKAD, KEYAKINAN** ✨</h1>
            <p>
                "Ada cahaya yang tidak bisa padam: **Cahaya yang lahir dari tekad dan keyakinan.** Nyalakan obormu. Karena perjalanan besar selalu dimulai dari satu nyala kecil."
            </p>
            
            <button class="button" onclick="goToSlide(2)">
                MASUK KE MATERI AUDIO
            </button>
        </div>

        <div class="slide" id="slide2">
            <div class="slide-content-bottom-center">
                <div class="audio-player-container">
                    <h2>🎧 MATERI INSPIRASI: GASKEUN! 🎧</h2>
                    <audio controls>
                        <source src="Gaskeun(2).mp3" type="audio/mpeg">
                        Browser Anda tidak mendukung elemen audio.
                    </audio>
                </div>
            </div>
            </div>

    </div>

    <script>
        function goToSlide(slideNumber) {
            const container = document.getElementById('slideContainer');
            if (slideNumber === 2) {
                container.classList.add('show-slide-2');
            } else if (slideNumber === 1) {
                container.classList.remove('show-slide-2');
            }
        }
    </script>

</body>
</html>
